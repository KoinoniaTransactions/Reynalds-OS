name: One-time capacity ad voice artifact

on:
  push:
    paths:
      - '.github/workflows/ad-capacity-voice.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Download generated narration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voice
          curl -L --fail --silent --show-error 'https://resource2.heygen.ai/text_to_speech/fe6821dcc4f044298ffc81b5a25fbda5/03dca9ebfca441dba55fb14afa0791b7/id=f0937142-83cf-4edb-aa29-36e07c206c7c.wav' -o voice/capacity.wav
          file voice/capacity.wav
      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: koinonia-capacity-voice
          path: voice/capacity.wav
          retention-days: 1
