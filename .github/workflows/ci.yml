name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:portal -- --skip-database
        env:
          AUTH_PROVIDER: clerk
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          DATABASE_URL: postgresql://portal-readiness-ci:portal-readiness-ci@localhost:5432/portal_readiness_ci
          ROS_ALLOW_MOCK_AUTH: "false"
      - run: pnpm test
      - run: pnpm build
