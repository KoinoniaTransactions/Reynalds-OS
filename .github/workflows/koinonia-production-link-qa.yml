name: Check public short links
on:
  push:
    branches: [feature/koinonia-shortlinks-next-60-2026-11-03]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test public custom domain branded links
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,time
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl):
              return None
          opener=urllib.request.build_opener(NoRedirect())
          tests={'K031':(307,'K-031'),'K060':(307,'K-060'),'K061':(307,'K-061'),'K062':(307,'K-062'),'K064':(307,'K-064'),'K137':(307,'K-137'),'K063':(404,None),'K138':(404,None)}
          for attempt in range(1):
            results=[]
            for code,(expected,tracking) in tests.items():
              url='https://www.koinoniatransactions.com/go/'+code
              req=urllib.request.Request(url,headers={'User-Agent':'Koinonia-Redirect-Production-QA'})
              try: res=opener.open(req,timeout=15)
              except urllib.error.HTTPError as e: res=e
              except Exception as e:
                print('network error',code,str(e)[:100],flush=True)
                results.append(False)
                continue
              location=res.headers.get('Location','')
              good=res.status==expected and (tracking is None or ('utm_content='+tracking in location))
              print('CHECK',attempt,code,'HTTP',res.status,'LOCATION',location[:230],'PASS',good,flush=True)
              results.append(good)
            if all(results):
              print('PRODUCTION_LINK_SMOKE_SUCCESS',flush=True)
              break
            if attempt==0:raise SystemExit('Production links did not pass')
            time.sleep(10)
          PY
