name: Koinonia short-link smoke checks
on:
  push:
    branches: [feature/koinonia-shortlinks-next-60-2026-11-03]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify preview redirect responses
        env:
          PREVIEW: https://reynalds-os-d0ochv1r7-koinonia3.vercel.app
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error
          base=os.environ["PREVIEW"]
          for code in ["K031","K060","K061","K062","K064","K137","K063","K138"]:
            url=base+"/go/"+code
            try:
              req=urllib.request.Request(url,method="GET",headers={"User-Agent":"Koinonia Link QA"})
              opener=urllib.request.build_opener(urllib.request.HTTPHandler())
              res=opener.open(req, timeout=25)
            except urllib.error.HTTPError as e:
              res=e
            except Exception as e:
              print(code,"NETWORK_ERROR",type(e).__name__,str(e)[:200])
              continue
            print(code,"HTTP",res.status,"Location",res.headers.get("Location",""),"Content-Type",res.headers.get("Content-Type",""))
          PY
