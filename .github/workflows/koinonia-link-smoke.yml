name: Koinonia short-link smoke checks
on:
  push:
    branches: [feature/koinonia-shortlinks-next-60-2026-11-03]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify preview redirect responses
        env:
          PREVIEW: https://reynalds-os-d0ochv1r7-koinonia3.vercel.app
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error
          base=os.environ["PREVIEW"]
          for code in ["K031","K060","K061","K062","K064","K137","K063","K138"]:
            url=base+"/go/"+code
            try:
              req=urllib.request.Request(url,method="GET",headers={"User-Agent":"Koinonia Link QA"})
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
              opener=urllib.request.build_opener(NoRedirect())
              res=opener.open(req, timeout=25)
            except urllib.error.HTTPError as e:
              res=e
            except Exception as e:
              print(code,"NETWORK_ERROR",type(e).__name__,str(e)[:200])
              continue
            print(code,"HTTP",res.status,"Location",res.headers.get("Location",""),"Content-Type",res.headers.get("Content-Type",""))
            expected=307 if code in ["K031","K060","K061","K062","K064","K137"] else 404
            if res.status != expected: raise RuntimeError(f"{code}: expected {expected}, got {res.status}")
            if expected == 307 and "utm_content=K-" not in res.headers.get("Location",""): raise RuntimeError(f"{code}: wrong tracking redirect")
          PY
