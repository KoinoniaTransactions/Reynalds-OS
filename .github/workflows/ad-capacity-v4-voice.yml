name: One-time capacity v4 narration artifact

on:
  push:
    paths:
      - '.github/workflows/ad-capacity-v4-voice.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Download generated narration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voice
          curl -L --fail --silent --show-error 'https://resource2.heygen.ai/text_to_speech/fe6821dcc4f044298ffc81b5a25fbda5/03dca9ebfca441dba55fb14afa0791b7/id=08a7c915-9bc7-4f46-9885-791399b9d3d6.wav' -o voice/capacity-v4.wav
          file voice/capacity-v4.wav
      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: koinonia-capacity-v4-voice
          path: voice/capacity-v4.wav
          retention-days: 1
