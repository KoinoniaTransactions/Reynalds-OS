name: One-time launch-safe v5 narration artifact

on:
  push:
    paths:
      - '.github/workflows/ad-capacity-v5-launchsafe-voice.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Download narration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voice
          curl -L --fail --silent --show-error 'https://resource2.heygen.ai/text_to_speech/fe6821dcc4f044298ffc81b5a25fbda5/03dca9ebfca441dba55fb14afa0791b7/id=f234035e-5bc5-4630-94fc-22611129ab27.wav' -o voice/launch-safe.wav
          file voice/launch-safe.wav
      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: koinonia-capacity-v5-launchsafe-voice
          path: voice/launch-safe.wav
          retention-days: 1
