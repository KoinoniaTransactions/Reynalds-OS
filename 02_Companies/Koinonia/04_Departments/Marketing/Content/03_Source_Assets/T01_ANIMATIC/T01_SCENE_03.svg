<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="Opportunity should not become operational chaos.">
  <title>Opportunity, not chaos</title>
  <rect width="1080" height="1920" fill="#F7F3EC"/>

  <text x="92" y="138" font-family="Arial, 'Nimbus Sans', sans-serif" font-size="24" font-weight="700" letter-spacing="5" fill="#986C2C">REAL ESTATE OPERATIONS SUPPORT</text>

    <circle cx="884" cy="126" r="70" fill="#171717"/>
    <circle cx="884" cy="126" r="49" fill="none" stroke="#B88A44" stroke-width="6"/>
    <text x="884" y="153" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-size="72" font-weight="700" fill="#B88A44">K</text>

      <text x="92" y="450" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif" font-size="100" font-weight="700" fill="#171717">OPPORTUNITY</text>
<text x="92" y="575" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif" font-size="100" font-weight="700" fill="#171717">SHOULD NOT</text>
<text x="92" y="700" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif" font-size="100" font-weight="700" fill="#171717">BECOME</text>
<text x="92" y="825" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif" font-size="100" font-weight="700" fill="#171717">CHAOS.</text>
      <rect x="92" y="1035" width="896" height="208" rx="36" fill="#FFFDFC" stroke="#E4D8C5" stroke-width="3"/>
      <text x="540" y="1120" text-anchor="middle" font-family="Arial, 'Nimbus Sans', sans-serif" font-size="30" font-weight="700" fill="#625D55">GROWTH SHOULD CREATE CAPACITY</text>
      <text x="540" y="1186" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-size="54" font-weight="700" fill="#B88A44">not more pressure.</text>

    <rect x="64" y="1575" width="952" height="246" rx="38" fill="#171717"/>
    <text x="540" y="1664" text-anchor="middle" font-family="Arial, 'Nimbus Sans', sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">The little things only become urgent</text>
<text x="540" y="1722" text-anchor="middle" font-family="Arial, 'Nimbus Sans', sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">when they get missed.</text>
  </svg>
