<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="More closings create more opportunity.">
  <title>More closings</title>
  <rect width="1080" height="1920" fill="#F7F3EC"/>

  <text x="92" y="138" font-family="Arial, 'Nimbus Sans', sans-serif" font-size="24" font-weight="700" letter-spacing="5" fill="#986C2C">REAL ESTATE OPERATIONS SUPPORT</text>

    <circle cx="884" cy="126" r="70" fill="#171717"/>
    <circle cx="884" cy="126" r="49" fill="none" stroke="#B88A44" stroke-width="6"/>
    <text x="884" y="153" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-size="72" font-weight="700" fill="#B88A44">K</text>

      <text x="92" y="510" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif" font-size="132" font-weight="700" fill="#171717">MORE</text>
<text x="92" y="660" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif" font-size="132" font-weight="700" fill="#171717">CLOSINGS.</text>
